<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b57d0"
    >

    <title>Karya HTML</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }


        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }


        .app {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            background: #ffffff;
        }


        /* ==============================
           HEADER
        ============================== */

       .header {
    position: relative;
    padding: 30px 20px 18px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

        .header h1 {
            margin: 0;
            color: #0b57d0;
            font-size: 16px;
            font-weight: 800;
        }


        .header p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 13px;
        }


        /* ==============================
           IDENTITAS
        ============================== */

        .profile {
            margin: 18px;
            padding: 15px 17px;
            background: #f7f9fc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }


        .profile-label {
            color: #6b7280;
            font-size: 11px;
            margin-bottom: 4px;
        }


        .profile-name {
            color: #111827;
            font-size: 16px;
            font-weight: 800;
        }


        .profile-school {
            margin-top: 4px;
            color: #374151;
            font-size: 13px;
        }


        /* ==============================
           KARYA
        ============================== */

        .content {
            padding: 0 18px 30px;
        }


        .karya-card {
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            
            background: #ffffff;
            box-shadow:
                0 4px 15px rgba(0,0,0,.05);
        }


        .karya-header {
            padding: 18px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
        }


        .karya-number {
            font-size: 11px;
            font-weight: 800;
            color: #0b57d0;
            margin-bottom: 5px;
        }


        .karya-title {
            margin: 0;
            font-size: 21px;
            color: #111827;
        }


        .karya-description {
            margin-top: 7px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }


        /* ==============================
           HASIL HTML
        ============================== */

        .result-title {
            padding: 14px 17px 8px;
            font-size: 13px;
            font-weight: 800;
            color: #374151;
        }


        .preview-frame {
    width: 100%;
    height: calc(100vh - 220px);

    display: block;

    border: none;
    border-radius: 0;

    background: #ffffff;

   
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
}

.app {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    height: auto;
    background: #ffffff;
    overflow: visible;
}

.content {
    padding: 0;
    margin: 0;
}

.karya-card {
    border: none;
    border-radius: 0;
    box-shadow: none;
}

.karya-header {
    padding: 10px 15px;
}

.result-title {
    padding: 5px 15px;
}

        /* ==============================
           LOADING
        ============================== */

        .loading {
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }


        .error {
            margin: 20px 0;
            padding: 14px;
            border-radius: 10px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }


        @media (max-width: 600px) {

            .header h1 {
                font-size: 22px;
            }


            .preview-frame {
                height: 500px;
            }

        }
.logo-pgri {
    position: absolute;
    left: 18px;
    top: 25px;
    width: 105px;
    height: 105px;
    object-fit: contain;
}

/* ==============================
   TOMBOL FULL SCREEN
============================== */

.fullscreen-bar {
    padding: 10px 15px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
}

.fullscreen-btn {
    width: 40%;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    background: #05a527;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
     /* posisi tengah */
    display: block;
    margin: 0 auto;
}

.fullscreen-btn:hover {
    background: #0847ad;
}

.fullscreen-btn:active {
    transform: scale(.99);
}

/* Saat karya fullscreen */
.karya-card:fullscreen {
    width: 100vw;
    height: 100vh;
    margin: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: #ffffff;
    display: flex;
    flex-direction: column;
}

.karya-card:fullscreen .karya-header,
.karya-card:fullscreen .result-title {
    display: none;
}

.karya-card:fullscreen .preview-frame {
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    border: none;
    border-radius: 0;
}

/* Tombol keluar */
.fullscreen-exit {
    display: none;
    position: fixed;
    z-index: 999999;
    top: 12px;
    right: 12px;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    background: rgba(0,0,0,.72);
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.karya-card:fullscreen .fullscreen-exit {
    display: block;
}

    </style>

</head>


<body>


<main class="app">


    <!-- HEADER -->

<header class="header">

    <img
        src="PgriPower.png"
        alt="PGRI Power"
        class="logo-pgri"
    >

    <h1>
        MEDIA PEMBELAJARAN INTERAKTIF
    </h1>

    <p style="font-size: 16px; color: #dc2626; font-weight: 800;">
        PGRI POWER BOJONEGORO
    </p>

    <div
        class="profile-name"
        id="namaPeserta"
    >
        -
    </div>

    <div
        class="profile-school"
        id="namaLembaga"
    >
        -
    </div>

</header>

<!-- TOMBOL FULL SCREEN -->
<div class="fullscreen-bar">
    <button
        type="button"
        class="fullscreen-btn"
        id="fullscreenBtn"
    >
        ⛶ TAMPILKAN KARYA FULL SCREEN
    </button>
</div>

    <!-- IDENTITAS PESERTA -->





    <!-- CONTENT -->

    <section class="content">

        <div
            id="loading"
            class="loading"
        >
            Memuat karya...
        </div>


        <div
            id="karyaContainer"
            style="display:none;"
        >

            <div class="karya-card">


                <div class="karya-header">

                 


                    


                    

                </div>



                <div class="result-title">
                    
                    <h2
                        class="karya-title"
                        id="judulKarya"
                    >
                        -
                    </h2>
<div
                        class="karya-description"
                        id="deskripsiKarya"
                    >
                        -
                    </div>
                </div>


                <button
    type="button"
    class="fullscreen-exit"
    id="fullscreenExit"
>
    ✕ Keluar Fullscreen
</button>

                <iframe
                    id="previewFrame"
                    class="preview-frame"
                    sandbox="allow-scripts allow-forms"
                ></iframe>


            </div>

        </div>


        <div
            id="error"
            class="error"
            style="display:none;"
        ></div>

    </section>



    <footer class="footer">

        @Zakun 2026

    </footer>


</main>



<script type="module">


    /* ==============================
       FIREBASE IMPORT
    ============================== */

    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getFirestore,
        doc,
        getDoc
    }
    from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    /* ==============================
       FIREBASE CONFIG
    ============================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDBniouJUxP3yjTKa-a8V7pnmURaMAgauU",

        authDomain:
            "gurudigital-5d7e4.firebaseapp.com",

        projectId:
            "gurudigital-5d7e4",

        storageBucket:
            "gurudigital-5d7e4.firebasestorage.app",

        messagingSenderId:
            "370848747092",

        appId:
            "1:370848747092:web:2400203d6db77adcbbe7c1",

        measurementId:
            "G-LLPTMEWQ96"

    };



    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);



    /* ==============================
       ELEMENT
    ============================== */

    const loading =
        document.getElementById("loading");

    const errorEl =
        document.getElementById("error");

  

    const namaPeserta =
        document.getElementById("namaPeserta");

    const namaLembaga =
        document.getElementById("namaLembaga");

    const karyaContainer =
        document.getElementById("karyaContainer");



    const judulKarya =
        document.getElementById("judulKarya");

    const deskripsiKarya =
        document.getElementById("deskripsiKarya");

    const previewFrame =
        document.getElementById("previewFrame");



    /* ==============================
       AMBIL PARAMETER URL
    ============================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const uid =
        params.get("id");


    const karyaKey =
        params.get("karya");



    /* ==============================
       VALIDASI
    ============================== */

    function tampilkanError(message) {

        loading.style.display =
            "none";

        karyaContainer.style.display =
            "none";

        errorEl.textContent =
            message;

        errorEl.style.display =
            "block";

    }



    if (!uid) {

        tampilkanError(
            "ID peserta tidak ditemukan pada alamat halaman."
        );

        throw new Error(
            "UID tidak ditemukan."
        );

    }



    const daftarKarya = [
        "karya1",
        "karya2",
        "karya3"
    ];


    if (
        !karyaKey ||
        !daftarKarya.includes(karyaKey)
    ) {

        tampilkanError(
            "Karya yang diminta tidak valid."
        );

        throw new Error(
            "Karya tidak valid."
        );

    }


    /* ==============================
   FULL SCREEN KARYA
============================== */

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const fullscreenExit =
    document.getElementById("fullscreenExit");

const karyaCard =
    document.querySelector(".karya-card");


async function masukFullscreen() {

    try {

        if (karyaCard.requestFullscreen) {

            await karyaCard.requestFullscreen();

        } else if (karyaCard.webkitRequestFullscreen) {

            karyaCard.webkitRequestFullscreen();

        } else {

            alert(
                "Browser ini tidak mendukung mode fullscreen."
            );

        }

    } catch (error) {

        console.error(
            "Gagal masuk fullscreen:",
            error
        );

    }

}


function keluarFullscreen() {

    try {

        if (document.fullscreenElement) {

            document.exitFullscreen();

        } else if (document.webkitFullscreenElement) {

            document.webkitExitFullscreen();

        }

    } catch (error) {

        console.error(
            "Gagal keluar fullscreen:",
            error
        );

    }

}


fullscreenBtn.addEventListener(
    "click",
    masukFullscreen
);


fullscreenExit.addEventListener(
    "click",
    keluarFullscreen
);


document.addEventListener(
    "fullscreenchange",
    function () {

        const sedangFullscreen =
            document.fullscreenElement === karyaCard;

        fullscreenBtn.style.display =
            sedangFullscreen
                ? "none"
                : "block";

    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape" &&
            document.fullscreenElement
        ) {

            keluarFullscreen();

        }

    }
);


    /* ==============================
       LOAD KARYA
    ============================== */

    async function loadKarya() {

        try {

            const ref =
                doc(
                    db,
                    "Kreasi_HTML",
                    uid
                );


            const snap =
                await getDoc(ref);


            if (!snap.exists()) {

                tampilkanError(
                    "Data karya peserta belum tersedia."
                );

                return;

            }


            const data =
                snap.data();


            const karya =
                data[karyaKey];


            if (!karya) {

                tampilkanError(
                    "Karya ini belum dibuat atau belum disimpan."
                );

                return;

            }


            /* ==========================
               DATA PESERTA
            ========================== */

            namaPeserta.textContent =
                data.namaLengkap ||
                "Peserta";


            namaLembaga.textContent =
                data.namaLembaga ||
                "";


        


            /* ==========================
               DATA KARYA
            ========================== */

            const nomor =
                karyaKey
                    .replace("karya", "");


      


            judulKarya.textContent =
                karya.judul ||
                "Tanpa Judul";


            deskripsiKarya.textContent =
                karya.deskripsi ||
                "Tidak ada deskripsi.";



            /* ==========================
               TAMPILKAN HTML
            ========================== */

            const kodeHtml =
                karya.kodeHtml ||
                "";


            if (!kodeHtml.trim()) {

                tampilkanError(
                    "Kode HTML pada karya ini masih kosong."
                );

                return;

            }


            previewFrame.srcdoc =
                kodeHtml;



            /* ==========================
               TAMPILKAN HALAMAN
            ========================== */

            loading.style.display =
                "none";


            karyaContainer.style.display =
                "block";


            /* ==========================
               JUDUL BROWSER
            ========================== */

            document.title =
                karya.judul
                    ? karya.judul +
                      " - Karya HTML"
                    : "Karya HTML";


        }

        catch (error) {

            console.error(
                "Gagal memuat karya:",
                error
            );


            tampilkanError(
                "Gagal memuat karya. Silakan coba lagi."
            );

        }

    }



    loadKarya();


</script>


</body>

</html>
